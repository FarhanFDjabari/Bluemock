[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluemock"
version = "0.1.0"
description = "Configurable BLE peripherals for the Android emulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FarhanFDjabari" }]
keywords = ["bluetooth", "ble", "android", "emulator", "netsim", "bumble", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["bumble[android]==0.0.236", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/FarhanFDjabari/Bluemock"
Issues = "https://github.com/FarhanFDjabari/Bluemock/issues"

[project.scripts]
bluemock = "bluemock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bluemock"]

[tool.hatch.build]
include = ["src/bluemock/**/*.py", "src/bluemock/presets/*.yaml", "README.md", "scripts/install.sh"]
